<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      body { width: 300px; margin: 0; padding: 14px; color: #1f2937; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; font-size: 11px; color: #6b7280; margin: 8px 0 3px; }
      input {
        width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 12px;
        border: 1px solid #d1d5db; border-radius: 8px;
      }
      button {
        width: 100%; margin-top: 12px; padding: 9px; font-size: 13px; font-weight: 600;
        color: #fff; background: #2563eb; border: 0; border-radius: 8px; cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: default; }
      .msg { margin-top: 10px; font-size: 12px; line-height: 1.4; white-space: pre-wrap; }
      .ok { color: #047857; }
      .err { color: #b91c1c; }
      .hint { margin-top: 10px; font-size: 11px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <h1>Refresh DY session</h1>
    <label for="appUrl">AskAnything app URL</label>
    <input id="appUrl" type="url" placeholder="http://localhost:3000" />
    <button id="push">Capture &amp; push session</button>
    <div id="msg" class="msg"></div>
    <div class="hint">
      Reads the DY cookie (incl. HttpOnly) for adm.dynamicyield.com and sends it to
      <code>/api/dy-session</code>. Make sure you are logged in to DY first.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
